apiVersion: apps/v1
kind: Deployment
metadata:
  name: investigator
  namespace: rackpilot
  labels:
    app.kubernetes.io/name: investigator
    app.kubernetes.io/part-of: rackpilot
    app.kubernetes.io/managed-by: rackpilot-k8s
    app.kubernetes.io/component: investigator
    rackpilot.io/app-tier: rackpilot-core
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: investigator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: investigator
        app.kubernetes.io/part-of: rackpilot
        app.kubernetes.io/component: investigator
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: investigator
          image: rackpilot/investigator:0.1.0
          imagePullPolicy: IfNotPresent
          args: ["-listen", ":8084"]
          envFrom:
            - configMapRef:
                name: rackpilot-app-config
          env:
            - name: RACKPILOT_INVESTIGATOR_LISTEN
              value: ":8084"
            - name: RACKPILOT_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rackpilot-llm
                  key: RACKPILOT_LLM_API_KEY
                  optional: true
          ports:
            - name: http
              containerPort: 8084
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20