apiVersion: apps/v1
kind: Deployment
metadata:
  name: rackpilot-demo-api
  namespace: rackpilot
  labels:
    app.kubernetes.io/name: rackpilot-demo-api
    app.kubernetes.io/part-of: rackpilot
    app.kubernetes.io/managed-by: rackpilot-k8s
    app.kubernetes.io/component: demo-api
    rackpilot.io/telemetry: kubernetes-workload
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: rackpilot-demo-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rackpilot-demo-api
        app.kubernetes.io/part-of: rackpilot
        app.kubernetes.io/component: demo-api
        rackpilot.io/telemetry: kubernetes-workload
    spec:
      containers:
        - name: api
          image: registry.k8s.io/e2e-test-images/agnhost:2.52
          args:
            - netexec
            - --http-port=8080
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: rackpilot-demo-api
  namespace: rackpilot
  labels:
    app.kubernetes.io/name: rackpilot-demo-api
    app.kubernetes.io/part-of: rackpilot
spec:
  selector:
    app.kubernetes.io/name: rackpilot-demo-api
  ports:
    - name: http
      port: 8080
      targetPort: http