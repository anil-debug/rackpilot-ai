apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-engine
  namespace: rackpilot
  labels:
    app.kubernetes.io/name: incident-engine
    app.kubernetes.io/part-of: rackpilot
    app.kubernetes.io/managed-by: rackpilot-k8s
    app.kubernetes.io/component: incident-engine
    rackpilot.io/app-tier: rackpilot-core
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: incident-engine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: incident-engine
        app.kubernetes.io/part-of: rackpilot
        app.kubernetes.io/component: incident-engine
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: incident-engine
          image: rackpilot/incident-engine:0.1.0
          imagePullPolicy: IfNotPresent
          args: ["-listen", ":8083"]
          envFrom:
            - configMapRef:
                name: rackpilot-app-config
          env:
            - name: RACKPILOT_INCIDENT_LISTEN
              value: ":8083"
          ports:
            - name: http
              containerPort: 8083
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20