apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-simulator
  namespace: rackpilot
  labels:
    app.kubernetes.io/name: gpu-simulator
    app.kubernetes.io/part-of: rackpilot
    app.kubernetes.io/managed-by: rackpilot-k8s
    app.kubernetes.io/component: gpu-simulator
    rackpilot.io/app-tier: rackpilot-core
    rackpilot.io/telemetry: synthetic
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gpu-simulator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gpu-simulator
        app.kubernetes.io/part-of: rackpilot
        app.kubernetes.io/component: gpu-simulator
        rackpilot.io/telemetry: synthetic
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gpu-simulator
          image: rackpilot/gpu-simulator:0.1.0
          imagePullPolicy: IfNotPresent
          args: ["-listen", ":8080"]
          envFrom:
            - configMapRef:
                name: rackpilot-app-config
          env:
            - name: RACKPILOT_LISTEN
              value: ":8080"
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20