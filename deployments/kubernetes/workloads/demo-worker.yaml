apiVersion: apps/v1
kind: Deployment
metadata:
  name: rackpilot-demo-worker
  namespace: rackpilot
  labels:
    app.kubernetes.io/name: rackpilot-demo-worker
    app.kubernetes.io/part-of: rackpilot
    app.kubernetes.io/managed-by: rackpilot-k8s
    app.kubernetes.io/component: demo-worker
    rackpilot.io/telemetry: kubernetes-workload
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rackpilot-demo-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rackpilot-demo-worker
        app.kubernetes.io/part-of: rackpilot
        app.kubernetes.io/component: demo-worker
        rackpilot.io/telemetry: kubernetes-workload
    spec:
      containers:
        - name: worker
          image: registry.k8s.io/e2e-test-images/agnhost:2.52
          args:
            - netexec
            - --http-port=8080
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10