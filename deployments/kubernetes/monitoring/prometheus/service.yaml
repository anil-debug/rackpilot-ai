apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: rackpilot-monitoring
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: rackpilot
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: rackpilot
  ports:
    - name: http
      port: 9090
      targetPort: http