apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: rackpilot-monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: rackpilot
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: rackpilot
  ports:
    - name: http
      port: 3000
      targetPort: http