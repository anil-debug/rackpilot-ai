# Apply after copy: kubectl apply -f secret.example.yaml
# Never commit real passwords to git.
apiVersion: v1
kind: Secret
metadata:
  name: rackpilot-grafana-admin
  namespace: rackpilot-monitoring
  labels:
    app.kubernetes.io/part-of: rackpilot
type: Opaque
stringData:
  GF_SECURITY_ADMIN_USER: admin
  GF_SECURITY_ADMIN_PASSWORD: rackpilot-dev